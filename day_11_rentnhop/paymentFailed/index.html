<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Payment Page</title>
  </head>
  <body>
    <header>
      <div id="top-section">
        <div id="drop-down-section">
          <div class="dropdown">
            <select name="country" id="country-dropdown">
              <option value="India" class="country-options" selected>
                India
              </option>
              <option value="Japan" class="country-options">Japan</option>
              <option value="USA" class="country-options">USA</option>
            </select>
          </div>
          <div class="dropdown">
            <select name="country" id="language-dropdown">
              <option value="English" class="language-options" selected>
                English
              </option>
              <option value="Tamil" class="language-options">Tamil</option>
              <option value="Hindi" class="language-options">Hindi</option>
            </select>
          </div>
          <div class="dropdown">
            <select name="country" id="currency-dropdown">
              <option value="INR" class="currency-options" selected>INR</option>
              <option value="USD" class="currency-options">USD</option>
              <option value="EUR" class="currency-options">EUR</option>
            </select>
          </div>
        </div>
        <div class="social">
          <ul>
            <li class="social-item">
              <a href=""
                ><img src="./images/facebook.svg" alt="facebook logo"
              /></a>
            </li>
            <li class="social-item">
              <a href=""
                ><img src="./images/instagram.svg" alt="instagram logo"
              /></a>
            </li>
            <li class="social-item">
              <a href=""><img src="./images/x.svg" alt="x logo" /></a>
            </li>
            <div id="contact">
              <p>Call us at</p>
              <h3>981-862-7676</h3>
            </div>
          </ul>
        </div>
      </div>
      <div id="nav-section">
        <div id="title-nav">
          <div class="logo">
            <img src="./images/logo.png" alt="logo" />
            <div class="title">
              <h2>Rentnhop</h2>
              <p>Easy bike rentals</p>
            </div>
          </div>
        </div>

        <div class="image-wrapper">

        <button>

      </div>
